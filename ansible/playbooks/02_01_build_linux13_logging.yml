---
- name: Build Linux13 as the central firewall logging server
  hosts: logging_servers
  become: true
  gather_facts: true
  vars_files:
    - ../vars/lab/pc2.yml
  pre_tasks:
    - name: Validate Linux13 management IP
      ansible.builtin.assert:
        that:
          - ansible_host == '192.168.100.30'
  roles:
    - role: linux_syslog_receiver
      when: pc2_enable_linux13_logging_server
