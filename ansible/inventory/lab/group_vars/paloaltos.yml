# ============================================================
# Palo Alto Group Variables
# ============================================================

ansible_connection: local

firewall_vendor: paloaltonetworks
firewall_platform: panos

panos_api_protocol: https
panos_api_port: 443
panos_validate_certs: false

panos_vsys: vsys1

# ------------------------------------------------------------
# PAN-OS Provider Dictionary
# ------------------------------------------------------------

panos_provider:
  ip_address: "{{ ansible_host }}"
  api_key: "{{ vault_panos_api_keys[inventory_hostname] }}"
  port: "{{ panos_api_port }}"

# ------------------------------------------------------------
# Deploy provider
# ------------------------------------------------------------

panos_deploy_admin: svc_iac_deploy

panos_deploy_provider:

  ip_address: "{{ ansible_host }}"

  api_key: >-
    {{ vault_panos_deploy_api_keys[inventory_hostname] }}

  port: "{{ panos_api_port }}"
