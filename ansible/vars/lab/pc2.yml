---
pc2_enable_linux13_logging_server: true
pc2_enable_firewall_logging: true
pc2_enable_local_auth: true
pc2_enable_ldap_reference: trueI h
pc2_enable_ha_changes: false

pc2_syslog_server_ip: "192.168.100.30"
pc2_syslog_server_port: 514
pc2_syslog_protocol: udp

pc2_fgt_local_user: iac-lab-user
pc2_fgt_local_group: IAC-LAB-USERS
pc2_panos_local_admin: iac-readonly-admin

# Reference-only directory settings. 192.0.2.0/24 is documentation address space.
pc2_ldap_profile_name: IAC-DEMO-LDAP
pc2_ldap_server: 192.0.2.40
pc2_ldap_port: 636
pc2_ldap_bind_dn: "uid=fw-bind,ou=service-accounts,dc=lab,dc=example,dc=internal"
pc2_ldap_base_dn: "dc=lab,dc=example,dc=internal"
pc2_ldap_user_attribute: uid

# ============================================================
# VPN
# ============================================================

pc2_enable_vpn: false

pc2_vpn_ike_version: "2"

pc2_vpn_phase1_proposals:
  - aes256-sha256

pc2_vpn_phase2_proposals:
  - aes256-sha256

pc2_vpn_dh_groups:
  - "14"

pc2_vpn_pfs: enable

pc2_vpn_dpd: on-idle

pc2_vpn_natt: enable


# ============================================================
# VPN topology
#
# WAN addresses are discovered dynamically from each
# FortiGate WAN interface before VPN deployment.
# ============================================================

pc2_vpn_links:

  - name: IAC-HUB-FGT2

    left_host: fgt1
    right_host: fgt2

    left_lan: 192.168.11.0/24
    right_lan: 192.168.12.0/24

    route_seq: 5102
    policy_out_id: 6102
    policy_in_id: 6202


  - name: IAC-HUB-FGT3

    left_host: fgt1
    right_host: fgt3

    left_lan: 192.168.11.0/24
    right_lan: 192.168.13.0/24

    route_seq: 5103
    policy_out_id: 6103
    policy_in_id: 6203


  - name: IAC-HUB-FGT4

    left_host: fgt1
    right_host: fgt4

    left_lan: 192.168.11.0/24
    right_lan: 192.168.14.0/24

    route_seq: 5104
    policy_out_id: 6104
    policy_in_id: 6204


  - name: IAC-HUB-FGT5

    left_host: fgt1
    right_host: fgt5

    left_lan: 192.168.11.0/24
    right_lan: 192.168.15.0/24

    route_seq: 5105
    policy_out_id: 6105
    policy_in_id: 6205
