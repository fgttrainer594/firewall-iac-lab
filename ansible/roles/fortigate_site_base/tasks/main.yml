---
- name: Validate FortiGate role inputs
  ansible.builtin.assert:
    that:
      - fortigate_deploy_access_token is defined
      - transit_interface is defined
      - transit_ip is defined
      - transit_peer_ip is defined
      - wan_interface is defined
      - pod_id is defined
  tags: [always, preflight]

- name: Ensure FortiGate service objects
  fortinet.fortios.fortios_firewall_service_custom:
    vdom: "{{ fortigate_vdom }}"
    state: present
    access_token: "{{ fortigate_deploy_access_token }}"
    firewall_service_custom:
      name: "{{ service.name }}"
      protocol: "TCP/UDP/SCTP"
      tcp_portrange: "{{ service.destination_port if service.protocol == 'tcp' else '' }}"
      udp_portrange: "{{ service.destination_port if service.protocol == 'udp' else '' }}"
  loop: "{{ pc1_service_objects }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  no_log: true
  tags: [objects, services]

- name: Ensure FortiGate transit interface
  fortinet.fortios.fortios_system_interface:
    vdom: "{{ fortigate_vdom }}"
    state: present
    access_token: "{{ fortigate_deploy_access_token }}"
    system_interface:
      name: "{{ transit_interface }}"
      mode: static
      ip: "{{ transit_ip.split('/')[0] }} 255.255.255.252"
      allowaccess: [ping]
  no_log: true
  tags: [interfaces]

- name: Ensure FortiGate route to PAN-OS LAN
  fortinet.fortios.fortios_router_static:
    vdom: "{{ fortigate_vdom }}"
    state: present
    access_token: "{{ fortigate_deploy_access_token }}"
    router_static:
      seq_num: "{{ 100 + (pod_id | int) }}"
      dst: "{{ hostvars[transit_peer].lan_network }}"
      gateway: "{{ transit_peer_ip }}"
      device: "{{ transit_interface }}"
  no_log: true
  when: pc1_routing_mode == 'static'
  tags: [routing, static]

- name: Configure FortiGate OSPF when selected
  fortinet.fortios.fortios_router_ospf:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_deploy_access_token }}"
    router_ospf:
      router_id: "{{ transit_ip.split('/')[0] }}"
      area:
        - id: "0.0.0.0"
  no_log: true
  when: pc1_routing_mode == 'ospf'

- name: Configure FortiGate BGP when selected
  fortinet.fortios.fortios_router_bgp:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_deploy_access_token }}"
    router_bgp:
      as: "{{ pc1_fgt_asn }}"
      router_id: "{{ transit_ip.split('/')[0] }}"
      neighbor:
        - ip: "{{ transit_peer_ip }}"
          remote_as: "{{ pc1_panos_asn }}"
          activate: enable
          interface: "{{ transit_interface }}"
  no_log: true
  when: pc1_routing_mode == 'bgp'
  tags: [routing, bgp]

- name: Ensure representative FortiGate IPS sensor
  fortinet.fortios.fortios_ips_sensor:
    vdom: "{{ fortigate_vdom }}"
    state: present
    access_token: "{{ fortigate_deploy_access_token }}"
    ips_sensor:
      name: IAC-PC1-IPS
      comment: "Managed by IaC"
  no_log: true
  when: pc1_enable_security_profiles
  tags: [security_profiles, utm]

- name: Ensure FortiGate edge policy and SNAT
  fortinet.fortios.fortios_firewall_policy:
    vdom: "{{ fortigate_vdom }}"
    state: present
    access_token: "{{ fortigate_deploy_access_token }}"
    firewall_policy:
      policyid: "{{ 1000 + (pod_id | int) }}"
      name: "IAC-POD{{ pod_id }}-TO-INTERNET"
      srcintf: [{name: "{{ transit_interface }}"}]
      dstintf: [{name: "{{ wan_interface }}"}]
      srcaddr: [{name: all}]
      dstaddr: [{name: all}]
      action: accept
      schedule: always
      service: [{name: ALL}]
      nat: enable
      logtraffic: all
  no_log: true
  tags: [policy, nat]

- name: FortiGate baseline summary
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} baseline processed; routing_mode={{ pc1_routing_mode }}"
  tags: [verify]
