---
- name: Validate PAN-OS role inputs
  ansible.builtin.assert:
    that:
      - panos_deploy_provider is defined
      - transit_interface is defined
      - transit_ip is defined
      - transit_peer_ip is defined
      - lan_interface is defined
      - lan_gateway is defined
      - lan_network is defined
      - pod_id is defined
  tags: [always, preflight]
  
- name: Preflight - Verify PA deploy API connectivity
  paloaltonetworks.panos.panos_facts:
    provider: "{{ panos_deploy_provider }}"
    gather_subset:
      - system
  changed_when: false
  no_log: true
  tags: [always, preflight]
  
- name: Ensure PAN-OS service objects
  paloaltonetworks.panos.panos_service_object:
    provider: "{{ panos_deploy_provider }}"
    name: "{{ service.name }}"
    protocol: "{{ service.protocol }}"
    destination_port: "{{ service.destination_port }}"
    vsys: "{{ panos_vsys }}"
    state: present
  loop: "{{ pc1_service_objects }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  notify: Commit PAN-OS paced-class changes
  no_log: true
  tags: [objects, services]

- name: Ensure PAN-OS LAN zone
  paloaltonetworks.panos.panos_zone:
    provider: "{{ panos_deploy_provider }}"
    zone: "{{ pc1_panos_lan_zone }}"
    mode: layer3
    vsys: "{{ panos_vsys }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  tags: [interfaces, zones]

- name: Ensure PAN-OS TRANSIT zone
  paloaltonetworks.panos.panos_zone:
    provider: "{{ panos_deploy_provider }}"
    zone: "{{ pc1_panos_transit_zone }}"
    mode: layer3
    vsys: "{{ panos_vsys }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  tags: [interfaces, zones]

- name: Ensure PAN-OS transit interface
  paloaltonetworks.panos.panos_interface:
    provider: "{{ panos_deploy_provider }}"
    if_name: "{{ transit_interface }}"
    mode: layer3
    ip: ["{{ transit_ip }}"]
    enable_dhcp: false
    zone_name: "{{ pc1_panos_transit_zone }}"
    vr_name: "{{ pc1_panos_virtual_router }}"
    vsys: "{{ panos_vsys }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  tags: [interfaces, zones]

- name: Ensure PAN-OS LAN interface
  paloaltonetworks.panos.panos_interface:
    provider: "{{ panos_deploy_provider }}"
    if_name: "{{ lan_interface }}"
    mode: layer3
    ip: ["{{ lan_gateway }}"]
    enable_dhcp: false
    zone_name: "{{ pc1_panos_lan_zone }}"
    vr_name: "{{ pc1_panos_virtual_router }}"
    vsys: "{{ panos_vsys }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  tags: [interfaces, zones]

- name: Ensure PAN-OS virtual router membership
  paloaltonetworks.panos.panos_virtual_router:
    provider: "{{ panos_deploy_provider }}"
    name: "{{ pc1_panos_virtual_router }}"
    interface: ["{{ transit_interface }}", "{{ lan_interface }}"]
    vsys: "{{ panos_vsys }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  tags: [interfaces, routing]

- name: Ensure PAN-OS default route toward FortiGate
  paloaltonetworks.panos.panos_static_route:
    provider: "{{ panos_deploy_provider }}"
    name: IAC-DEFAULT-TO-FGT
    destination: 0.0.0.0/0
    nexthop: "{{ transit_peer_ip }}"
    interface: "{{ transit_interface }}"
    virtual_router: "{{ pc1_panos_virtual_router }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  when: pc1_routing_mode == 'static'
  tags: [routing, static]

- name: Explain classic PAN-OS OSPF automation path
  ansible.builtin.debug:
    msg: >-
      Classic virtual-router OSPF on older PAN-OS designs is a feature-coverage
      gap in the current dedicated modules. Validate the target-version XPath
      and use panos_config_element/API only after read-back testing; newer
      Advanced Routing Engine designs have logical-router OSPF modules.
  when: pc1_routing_mode == 'ospf'
  tags: [routing, ospf]

- name: Enable PAN-OS BGP when selected
  paloaltonetworks.panos.panos_bgp:
    provider: "{{ panos_deploy_provider }}"
    vr_name: "{{ pc1_panos_virtual_router }}"
    enable: true
    router_id: "{{ transit_ip.split('/')[0] }}"
    local_as: "{{ pc1_panos_asn }}"
    install_route: true
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  when: pc1_routing_mode == 'bgp'
  tags: [routing, bgp]

- name: Ensure PAN-OS LAN-to-TRANSIT security rule
  paloaltonetworks.panos.panos_security_rule:
    provider: "{{ panos_deploy_provider }}"
    rule_name: "IAC-POD{{ pod_id }}-LAN-OUT"
    source_zone: ["{{ pc1_panos_lan_zone }}"]
    destination_zone: ["{{ pc1_panos_transit_zone }}"]
    source_ip: ["{{ lan_network }}"]
    destination_ip: [any]
    application: [any]
    service: [application-default]
    action: allow
    log_end: true
    vsys: "{{ panos_vsys }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  tags: [policy]

- name: Explain NAT ownership in this topology
  ansible.builtin.debug:
    msg: >-
      FortiGate is the internet edge and owns production source NAT in the
      current five-pod design. PAN-OS panos_nat_rule2 is covered as the module
      for NAT when PAN-OS is the translation owner.
  tags: [nat]

- name: Ensure PAN-OS security profile group when enabled
  paloaltonetworks.panos.panos_pg:
    provider: "{{ panos_deploy_provider }}"
    pg_name: IAC-PC1-PROFILE-GROUP
    virus: default
    spyware: default
    vulnerability: default
    vsys: "{{ panos_vsys }}"
    state: present
  notify: Commit PAN-OS paced-class changes
  no_log: true
  when: pc1_enable_security_profiles
  tags: [security_profiles, utm]

- name: Flush PAN-OS commit before verification
  ansible.builtin.meta: flush_handlers
  tags: [always]

- name: Verify PAN-OS operational facts after baseline
  paloaltonetworks.panos.panos_facts:
    provider: "{{ panos_deploy_provider }}"
    gather_subset: [system, interfaces, routing]
  changed_when: false
  no_log: true
  tags: [verify]
