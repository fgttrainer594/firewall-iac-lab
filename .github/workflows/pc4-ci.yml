name: pc4-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pc4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-checks:
    name: ansible-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc4/requirements-ci.txt

      - name: Install Python validation tools
        run: python -m pip install -r pc4/requirements-ci.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r pc4/requirements-ansible.yml

      - name: Check tracked sensitive files
        run: bash pc4/scripts/pc4_secret_guard.sh

      - name: Run Ansible validation
        run: bash pc4/scripts/pc4_ci_ansible.sh

  terraform-checks:
    name: terraform-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORTIOS_ACCESS_HOSTNAME: 127.0.0.1
      FORTIOS_ACCESS_TOKEN: ci-placeholder
      FORTIOS_INSECURE: "true"
      PANOS_HOSTNAME: 127.0.0.1
      PANOS_API_KEY: ci-placeholder
      PANOS_VERIFY_CERTIFICATE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check tracked sensitive files
        run: bash pc4/scripts/pc4_secret_guard.sh

      - name: Run Terraform validation
        run: bash pc4/scripts/pc4_ci_terraform.sh
